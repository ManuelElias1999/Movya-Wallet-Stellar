name: Validate Movya

on:
  push:
    branches: [main, security]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform ios --platform web
      - run: npm run verify:web-csp

  native-vectors:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and verify CommonCrypto backup compatibility
        run: |
          swiftc modules/movya-password-key/ios/MovyaPasswordKey.swift tests/native-password-key/main.swift -o /tmp/movya-key-test
          /tmp/movya-key-test
      - name: Install Kotlin compiler if needed
        run: command -v kotlinc || brew install kotlin
      - name: Compile and verify JCA backup compatibility
        run: |
          kotlinc modules/movya-password-key/android/src/main/java/expo/modules/movyapasswordkey/MovyaPasswordKey.kt tests/native-password-key/NativePasswordKeyTest.kt -include-runtime -d /tmp/movya-key-test.jar
          java -jar /tmp/movya-key-test.jar
